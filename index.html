<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Bedrock Server Dashboard</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-online {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid #22c55e;
        }

        .status-offline {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid #ef4444;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .online .dot { background-color: #22c55e; }
        .offline .dot { background-color: #ef4444; }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .info-box {
            background: #0f172a;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #334155;
        }

        .info-box span {
            font-size: 0.75rem;
            color: #94a3b8;
            display: block;
        }

        .info-box p {
            font-size: 1rem;
            font-weight: 600;
            margin-top: 4px;
        }

        .ip-box {
            background: #0f172a;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px dashed #475569;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ip-box code {
            color: #38bdf8;
            font-size: 0.9rem;
        }

        .copy-btn, .action-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .copy-btn:hover, .action-btn:hover {
            background: #1d4ed8;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #059669;
        }

        .action-btn:hover {
            background: #047857;
        }

        .schedule-box {
            margin-top: 16px;
            background: #0f172a;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #334155;
        }

        .schedule-box h3 {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .schedule-box p {
            font-size: 0.85rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <!-- Header & Status -->
        <div class="header">
            <h1>Bedrock Server</h1>
            <div id="status-badge" class="status-badge status-offline offline">
                <span class="dot"></span> <span id="status-text">Checking...</span>
            </div>
        </div>

        <!-- IP Address Block -->
        <div class="ip-box">
            <div>
                <span style="font-size:0.75rem; color:#94a3b8; display:block;">PLAYIT IP ADDRESS</span>
                <code id="server-ip">your-playit-address.ply.gg:12345</code>
            </div>
            <button class="copy-btn" onclick="copyIp()">Copy</button>
        </div>

        <!-- Info Grid -->
        <div class="info-grid">
            <div class="info-box">
                <span>ONLINE PLAYERS</span>
                <p id="player-count">0 / 10</p>
            </div>
            <div class="info-box">
                <span>GAME VERSION</span>
                <p id="server-version">Bedrock (Latest)</p>
            </div>
            <div class="info-box">
                <span>NEXT MAINTENANCE</span>
                <p id="maintenance-date">Sunday 11:00 PM</p>
            </div>
            <div class="info-box">
                <span>DIFFICULTY</span>
                <p>Peaceful</p>
            </div>
        </div>

        <!-- Server Operating Timings -->
        <div class="schedule-box">
            <h3>⏰ DAILY OPERATING TIMINGS</h3>
            <p>• Slot 1: 2:00 AM – 5:00 PM</p>
            <p>• Slot 2: 7:30 PM – 10:00 PM</p>
        </div>

        <!-- Manual Start Trigger -->
        <button class="action-btn" onclick="triggerServerStart()">🚀 Request Server Start</button>
    </div>

    <script>
        // Replace this with your actual Playit.gg domain/port
        const SERVER_ADDRESS = "your-playit-address.ply.gg"; 

        async function fetchServerStatus() {
            try {
                // Public API that checks Minecraft Bedrock server status
                const res = await fetch(`https://api.mcsrvstat.us/bedrock/3/${SERVER_ADDRESS}`);
                const data = await res.json();

                const badge = document.getElementById('status-badge');
                const text = document.getElementById('status-text');
                const players = document.getElementById('player-count');
                const version = document.getElementById('server-version');

                if (data.online) {
                    badge.className = "status-badge status-online online";
                    text.innerText = "ONLINE";
                    players.innerText = `${data.players.online} / ${data.players.max}`;
                    version.innerText = data.version ? data.version : "Bedrock";
                } else {
                    badge.className = "status-badge status-offline offline";
                    text.innerText = "OFFLINE";
                    players.innerText = "0 / 0";
                }
            } catch (err) {
                console.error("Failed to fetch status:", err);
            }
        }

        function copyIp() {
            const ipText = document.getElementById('server-ip').innerText;
            navigator.clipboard.writeText(ipText);
            alert("IP Address copied to clipboard!");
        }

        function triggerServerStart() {
            alert("Server start request sent! If the host phone is active, your server will boot shortly.");
            // Webhook trigger can be connected here!
        }

        // Fetch status immediately on page load
        fetchServerStatus();
        // Refresh status every 30 seconds
        setInterval(fetchServerStatus, 30000);
    </script>
</body>
</html>
